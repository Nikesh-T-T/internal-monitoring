---
spring:
  config.activate.on-profile: default
  sql.init:
    platform: h2
    # schema-h2.sql is generated by the CDS build; index-h2.sql adds the unique
    # constraint and the indexes the dashboard and the retention job rely on.
    schema-locations:
      - classpath:schema-h2.sql
      - classpath:index-h2.sql
cds:
  data-source.auto-config.enabled: false

monitoring:
  kafka:
    # Absolute URL of the Kafka messages endpoint.
    endpoint: https://hermes-calm-dev-eu10-004.cfapps.eu10-004.hana.ondemand.com/v2/usecase/calm-dev-eu10-004/kafka/ms.calm-dev-eu10-004.internal-monitoring/messages
    # Stored with every message so several topics can be told apart later.
    topic: ms.calm-dev-eu10-004.internal-monitoring
    enabled: true
    # A full poll transfers several megabytes; raise this if the API or the
    # database cannot keep up.
    poll-interval: 5s
    initial-delay: 15s
    request-timeout: 120s
    connect-timeout: 15s
    # The default database is in-memory H2. Retention keeps the heap bounded -
    # see README.md before increasing it.
    retention: 1h
    retention-interval: 5m
    retention-enabled: true
    batch-size: 200

---
# Keeps ingested messages in a local H2 file instead of memory, so a restart
# does not lose the collected history.
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=persistent
spring:
  config.activate.on-profile: persistent
  datasource:
    url: jdbc:h2:file:./target/internal-monitoring-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql.init:
    platform: h2
    mode: always
    continue-on-error: true
    schema-locations:
      - classpath:schema-h2.sql
      - classpath:index-h2.sql
