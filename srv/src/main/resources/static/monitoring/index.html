<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kafka Message Monitoring</title>

	<!--
		Standalone (non-launchpad) apps must establish the height chain
		themselves: sap.fe pages size to their container, so without a
		full-height html/body/container the content collapses to 0px and
		the page renders blank.
	-->
	<style>
		html,
		body {
			height: 100%;
		}

		/*
			UI5 wraps the component in a generated preserve-area div before the
			ComponentContainer; both must be full height or the chain collapses
			to 0px between <body> and the sap.fe page.
		*/
		body > div,
		.sapUiComponentContainer {
			height: 100%;
		}
	</style>

	<!--
		UI5 is loaded from the public CDN. Point this at a locally hosted UI5
		distribution when the application has to run without internet access.
	-->
	<script id="sap-ui-bootstrap"
		src="https://ui5.sap.com/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m,sap.ui.layout,sap.fe.templates"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-frame-options="trusted"
		data-sap-ui-resource-roots='{"monitoring": "./"}'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
	</script>
</head>

<body class="sapUiBody sapUiSizeCompact" id="content">
	<div data-sap-ui-component data-name="monitoring" data-id="monitoringContainer" data-height="100%"></div>
</body>

</html>
