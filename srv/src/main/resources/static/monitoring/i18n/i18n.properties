appTitle=Kafka Message Monitoring
appDescription=Messages collected from the internal monitoring Kafka topic

credentialActionText=Set Session Cookie
credentialDialogTitle=Kafka API Session
credentialMissingText=No session is configured yet, so no messages are being collected.
credentialExpiredText=The stored session was rejected by the API and has most likely expired. Collection is paused until a new one is supplied.
credentialInstructions=Open the Kafka messages request in the browser developer tools (Network tab), copy the complete value of its "Cookie" request header and paste it below. Keep every cookie: JSESSIONID carries the session and __VCAP_ID__ routes the request to the server instance that holds it.
credentialCookieLabel=Cookie header value
credentialCookiePlaceholder=JTENANTSESSIONID_a060375d6=...; JSESSIONID=...; __VCAP_ID__=...; XSRF-TOKEN=...
credentialPrivacyNote=The value is kept in the server's memory only. It is never written to the database, to a file or to the log, and it is lost when the application restarts.
credentialSaveButton=Save
credentialCancelButton=Cancel
